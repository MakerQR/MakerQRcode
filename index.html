<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Studio — онлайн генератор QR-кодов</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="top">
  <div class="logo"><span class="logo-mark">▦</span> QR Studio</div>
  <div class="top-actions">
    <button class="btn ghost" id="styleBtn">🎨 Оформление QR</button>
    <button class="btn ghost" id="historyBtn">🕘 История</button>
  </div>
</header>

<noscript><p style="padding:20px;color:#fff">Для работы генератора включите JavaScript.</p></noscript>
<main class="layout">
  <!-- РЕДАКТОР -->
  <section class="card">
    <h2>Редактор</h2>

    <label class="lbl">Что зашифровать</label>
    <div class="chips" id="typeChips"></div>
    <div id="fields" class="fields"></div>

    <div class="row">
      <div>
        <label class="lbl">Цвет кода</label>
        <input type="color" id="fg" value="#1a1a2e">
      </div>
      <div>
        <label class="lbl">Цвет фона</label>
        <input type="color" id="bg" value="#ffffff">
      </div>
      <div>
        <label class="lbl">Размер</label>
        <select id="size">
          <option value="300">300 px</option>
          <option value="500">500 px</option>
          <option value="800">800 px</option>
          <option value="1000">1000 px</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="grow">
        <label class="lbl">Уровень коррекции ошибок</label>
        <select id="ec">
          <option value="L">L — 7%</option>
          <option value="M">M — 15%</option>
          <option value="Q">Q — 25%</option>
          <option value="H">H — 30% (лучше с логотипом)</option>
        </select>
      </div>
      <div class="grow">
        <label class="lbl">Логотип в центре</label>
        <input type="file" id="logo" accept="image/*">
      </div>
    </div>

    <div class="row actions">
      <button class="btn primary" id="genBtn">⚡ Сгенерировать</button>
      <button class="btn ghost" id="resetBtn">Сбросить настройки</button>
    </div>
    <p class="hint">Изменения применяются только после нажатия «Сгенерировать».</p>
  </section>

  <!-- ПРЕДПРОСМОТР -->
  <section class="card preview-card">
    <h2>Предпросмотр</h2>
    <div class="preview" id="preview">
      <p class="placeholder" id="placeholder">Здесь появится ваш QR-код.<br>Выберите настройки и нажмите «Сгенерировать».</p>
    </div>

    <div class="row actions center">
      <div class="split" id="saveWrap">
        <button class="btn primary" id="saveMain">💾 Сохранить (PNG)</button>
        <button class="btn primary arrow" id="saveArrow" aria-label="Выбрать формат" aria-expanded="false">▾</button>
        <div class="menu" id="saveMenu" hidden>
          <button data-ext="png">PNG</button>
          <button data-ext="jpeg">JPEG</button>
          <button data-ext="webp">WEBP</button>
          <button data-ext="svg">SVG (вектор)</button>
        </div>
      </div>
      <button class="btn ghost" id="openBtn">🔗 Открыть содержимое</button>
    </div>
  </section>
</main>

<!-- ОКНО ОФОРМЛЕНИЯ -->
<dialog id="styleDlg">
  <div class="dlg-head"><h3>Оформление QR-кода</h3><button class="x" data-close>✕</button></div>
  <label class="lbl">Форма точек</label>
  <div class="chips" id="dotChips"></div>
  <label class="lbl">Форма внешних углов</label>
  <div class="chips" id="cornerChips"></div>
  <label class="lbl">Форма внутренних углов</label>
  <div class="chips" id="cdotChips"></div>
  <label class="lbl check"><input type="checkbox" id="grad"> Градиент вместо одного цвета</label>
  <div class="row" id="gradRow" hidden>
    <div><label class="lbl">Второй цвет</label><input type="color" id="fg2" value="#7c3aed"></div>
  </div>
  <div class="row actions"><button class="btn primary" data-close>Готово</button></div>
  <p class="hint">Не забудьте нажать «Сгенерировать», чтобы применить оформление.</p>
</dialog>

<!-- ОКНО ИСТОРИИ -->
<dialog id="historyDlg">
  <div class="dlg-head"><h3>История генераций</h3><button class="x" data-close>✕</button></div>
  <div id="historyList" class="hist"></div>
  <div class="row actions"><button class="btn ghost" id="clearHist">Очистить историю</button></div>
</dialog>

<!-- ОКНО СОДЕРЖИМОГО -->
<dialog id="contentDlg">
  <div class="dlg-head"><h3>Зашифрованное сообщение</h3><button class="x" data-close>✕</button></div>
  <pre id="contentText" class="content"></pre>
  <div class="row actions"><button class="btn primary" id="copyBtn">Копировать</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script src="script.js?v=2"></script>
</body>
</html>
